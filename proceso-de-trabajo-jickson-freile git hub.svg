<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="100%" stop-color="#0f1b2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#4fd1e0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>

  <text x="600" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#edf2f7">Así trabajo contigo</text>
  <text x="600" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4fd1e0">Un proceso claro, medible y enfocado en resultados</text>

  <!-- Step template: circle number + icon-less card -->
  <!-- Positions: 5 cards across, y top ~190, width 200, gap 30 -->
  <!-- total width 5*200 + 4*30 = 1120, start x = 40 -->

  <!-- Connectors -->
  <line x1="240" y1="330" x2="270" y2="330" stroke="#4fd1e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="330" x2="500" y2="330" stroke="#4fd1e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="330" x2="730" y2="330" stroke="#4fd1e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="330" x2="960" y2="330" stroke="#4fd1e0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 1 -->
  <g>
    <rect x="40" y="180" width="200" height="300" rx="16" fill="#142238" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <circle cx="140" cy="235" r="26" fill="#2f6fff"/>
    <text x="140" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
    <text x="140" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Diagnóstico</text>
    <text x="140" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">gratuito</text>
    <text x="140" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">Reviso tu situación</text>
    <text x="140" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">actual y tus metas</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="270" y="180" width="200" height="300" rx="16" fill="#142238" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <circle cx="370" cy="235" r="26" fill="#2f6fff"/>
    <text x="370" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
    <text x="370" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Estrategia a</text>
    <text x="370" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">la medida</text>
    <text x="370" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">Defino el plan y las</text>
    <text x="370" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">herramientas a usar</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="500" y="180" width="200" height="300" rx="16" fill="#142238" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <circle cx="600" cy="235" r="26" fill="#2f6fff"/>
    <text x="600" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">3</text>
    <text x="600" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Implementación</text>
    <text x="600" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">Configuro campañas,</text>
    <text x="600" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">tienda o automatización</text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="730" y="180" width="200" height="300" rx="16" fill="#142238" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <circle cx="830" cy="235" r="26" fill="#2f6fff"/>
    <text x="830" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">4</text>
    <text x="830" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Optimización</text>
    <text x="830" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">continua</text>
    <text x="830" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">Ajusto y mejoro con</text>
    <text x="830" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">base en los datos</text>
  </g>

  <!-- Card 5 -->
  <g>
    <rect x="960" y="180" width="200" height="300" rx="16" fill="#142238" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <circle cx="1060" cy="235" r="26" fill="#2f6fff"/>
    <text x="1060" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">5</text>
    <text x="1060" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Reportes y</text>
    <text x="1060" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">resultados</text>
    <text x="1060" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">Te muestro avances</text>
    <text x="1060" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8fa0b5">claros y crecimiento</text>
  </g>

  <text x="600" y="610" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Jickson Freile · Marketing Digital</text>
  <text x="600" y="638" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4fd1e0">301 863 8831 · jicksonfreile@gmail.com</text>
</svg>
